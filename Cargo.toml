[package]
name = "animref"
version = "2.0.0"
edition = "2024"
description = "A reference board for images, GIFs, video, and trimmed YouTube clips"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
clipboard-win = "5.4"
crossbeam-channel = "0.5"
directories = "6.0"
eframe = { version = "0.32", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
